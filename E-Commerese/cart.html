<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyStore Cart</title>
    <link rel="stylesheet" href="style.css">

<style>
.card {
    background: white;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 12px 25px rgba(0,0,0,0.07);
    transition: all 0.3s ease;
}

.card:hover {
    transform: translateY(-8px);
    box-shadow: 0 18px 35px rgba(0,0,0,0.15);
}

.card img {
    width: 170px;
    height: 170px;
    object-fit: contain;
    margin-bottom: 10px;
    transition: 0.3s;
}

.card:hover img {
    transform: scale(1.05);
}

.cart-btn {
    text-decoration: none;
    background: white;
    color: #2575fc;
    padding: 8px 15px;
    border-radius: 6px;
    font-weight: 600;
    transition: 0.3s;
}

.cart-btn:hover {
    background: #f0f0f0;
}

.products { 
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
    gap: 20px; 
    padding: 30px; 
}

.card h3 { 
    font-size: 16px; 
    margin: 8px 0; 
    color: #222; 
    font-weight: 600;
}

.card p { 
    margin: 4px 0; 
    color: #666; 
    font-size: 13px; 
}

.card div {
    margin: 10px 0;
}

.card button { 
    padding: 6px 10px; 
    border: none; 
    border-radius: 20px; 
    cursor: pointer; 
    font-size: 13px; 
    transition: 0.3s;
}

.qty-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.minus-btn {
    background: #e0e7ff;
    color: #2575fc;
}

.plus-btn {
    background: #2575fc;
    color: white;
}

.qty-btn:hover {
    transform: scale(1.1);
}

.remove-btn {
    background: linear-gradient(to right, #ff4d4d, #ff0000);
    border: none;
    padding: 8px 18px;
    border-radius: 25px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

.remove-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 15px rgba(255,0,0,0.4);
}

/* Total price */
.card p:last-of-type {
    font-weight: 600;
    font-size: 15px;
    margin-top: 8px;
    color: #111;
}

h2 {
    font-size: 28px;
    margin-top: 40px;
    font-weight: 700;
}

h2 span {
    color: #2575fc;
}

.qty-box {
    display: flex;
    justify-content: center;
    gap: 10px;
    align-items: center;
}

.empty-cart {
    text-align: center;
}

.checkout-box { 
    max-width: 400px; 
    margin: 30px auto; 
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
    text-align: center; 
} 

.checkout-box h3 { 
    margin-bottom: 15px; 
    color: #333; 
} 

.checkout-box input { 
    width: 90%; 
    padding: 10px; 
    margin-bottom: 15px; 
    border-radius: 6px; 
    border: 1px solid #ccc; 
    font-size: 14px; 
} 

.checkout-box input:focus { 
    outline: none; 
    border-color: #3e83fa; 
    box-shadow: 0 0 5px rgba(37,117,252,0.3); 
}

.checkout-box button { 
    width: 100%; 
    padding: 12px; 
    border-radius: 8px; 
    border: none; 
    background: linear-gradient(to right, #6a11cb, #2575fc); 
    color: white; 
    font-size: 15px; 
    cursor: pointer; 
    transition: 0.3s; 
} 

.checkout-box button:hover { 
    transform: scale(1.03); 
}
.total-heading {
    text-align: center;
}

</style>

</head>
<body>

<nav class="navbar">
    <h2 class="logo">MyStore</h2>
    <a href="index.html" class="cart-btn">⬅ Back</a>
</nav>

<section class="products" id="cartContainer"></section> 

<h2 class="total-heading">Total: ₹<span id="total">0</span></h2>

<div class="checkout-box">
    <h3>Checkout Details</h3>

    <input type="text" id="customerName" placeholder="Enter Your Name">

    <button onclick="goToBill()">Proceed to Checkout</button>
</div> 

<script src="cart.js"></script>
</body>
</html>
