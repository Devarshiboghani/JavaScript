<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="app-title">
      <i class="ti ti-checkbox"></i> To-Do App
    </div>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" data-tab="tasks">
      <i class="ti ti-list"></i> Tasks
    </button>
    <button class="nav-tab inactive" data-tab="today">
      <i class="ti ti-calendar"></i> Today
    </button>
    <button class="nav-tab inactive" data-tab="scheduled">
      <i class="ti ti-calendar-event"></i> Scheduled
    </button>
    <button class="nav-tab inactive" data-tab="completed">
      <i class="ti ti-checks"></i> Completed
    </button>
  </div>

  <div class="content">
    <div class="section-title" id="tabTitle">Tasks</div>

    <input class="task-input" id="taskInput" placeholder="Enter a task..." maxlength="120" autocomplete="off" />
    <button class="add-btn" id="addBtn">
      <i class="ti ti-plus"></i> Add Task
    </button>

    <div class="task-list" id="taskList"></div>

    <div class="clear-row" id="clearRow" style="display:none;">
      <button class="clear-btn" onclick="clearDone()">
        <i class="ti ti-trash"></i> Clear completed
      </button>
    </div>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
